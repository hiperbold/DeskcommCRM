# Dependências locais do DeskcommCRM Hiperbold (WSL). Sem WAHA: a Hiperbold usa só UAZAPI e Cloud API. App e worker rodam fora do Docker, via pnpm.
# Portas escolhidas para não colidir com o site da Unique (3000) no mesmo WSL.
#
#   docker compose -f hiperbold/docker-compose.dev.yml --env-file .env.local up -d

name: deskcomm-dev

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      - redis
